<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet" />
    <meta name="theme-color" content="#111111" />
    <meta
      name="description"
      content="Ferhan brings together design, development and consulting expertise in Perth, Western Australia. Choose the service that fits your project."
    />
    <title>Ferhan</title>
  </head>
  <body>
    <!-- Static form enables Netlify to detect the matching React form at deploy time. -->
    <form name="project-enquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="project-enquiry" />
      <input name="bot-field" />
      <input name="area" />
      <input name="first-name" />
      <input name="last-name" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="project-address" />
      <input name="service" />
      <textarea name="message"></textarea>
      <input name="consent" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
